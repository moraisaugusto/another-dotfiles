# NVIDIA X configuration
#
# Replaces the file nvidia-settings generated with driver 535.113.01.
# Kept intentionally minimal:
#   - no ForceCompositionPipeline (picom composites everything already)
#   - no HorizSync (EDID decides; the old "329.0 - 329.0" was invalid)
#   - no Mouse0/kbd InputDevice sections (libinput, hotplug)
#   - DP-4 at the origin, so booting without DP-2 leaves a single clean screen
#
# Install: sudo cp extras/etc/X11/xorg.conf /etc/X11/xorg.conf
#          then restart the display manager.

Section "ServerLayout"
    Identifier     "Layout0"
    Screen      0  "Screen0" 0 0
EndSection

Section "Monitor"
    Identifier     "Monitor0"
    VendorName     "ASUS"
    ModelName      "ROG XG27UQ"
    VertRefresh     48.0 - 144.0
    Option         "DPMS"
EndSection

Section "Device"
    Identifier     "Device0"
    Driver         "nvidia"
    VendorName     "NVIDIA Corporation"
    BoardName      "NVIDIA GeForce RTX 4090"
    BusID          "PCI:1:0:0"
EndSection

Section "Screen"
    Identifier     "Screen0"
    Device         "Device0"
    Monitor        "Monitor0"
    DefaultDepth   24
    Option         "Stereo" "0"
    Option         "nvidiaXineramaInfoOrder" "DFP-5"
    Option         "metamodes" "DP-4: nvidia-auto-select +0+0"
    Option         "SLI" "Off"
    Option         "MultiGPU" "Off"
    Option         "BaseMosaic" "off"
    SubSection     "Display"
        Depth       24
    EndSubSection
EndSection
